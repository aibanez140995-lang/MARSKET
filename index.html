<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARS-KET 2.0 | TACTICAL COMMAND</title>
    
    <!-- Favicon Oficial -->
    <link rel="icon" type="image/png" href="/logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mars: {
                            bg: '#05070a', card: '#0b121d', cyan: '#00f0ff',
                            magenta: '#ff0055', yellow: '#ffe600', green: '#00ff66',
                            border: '#1a2635'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #05070a; color: #e2e8f0; font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
        .glow-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
        .glow-magenta { box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }
        .terminal-border { border: 1px solid #1a2635; position: relative; clip-path: polygon(0 0, 98% 0, 100% 2%, 100% 100%, 2% 100%, 0 98%); }
        .scanline { width: 100%; height: 2px; background: rgba(0, 240, 255, 0.05); position: fixed; top: 0; pointer-events: none; z-index: 100; animation: scan 8s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100vh; } }
        .tab-active { border-bottom: 2px solid #00f0ff; color: #00f0ff; background: linear-gradient(to top, rgba(0, 240, 255, 0.1), transparent); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .led-green { width: 8px; height: 8px; border-radius: 50%; background: #00ff66; box-shadow: 0 0 5px #00ff66; }
        .glitch-text { text-shadow: 2px 0 #ff0055, -2px 0 #00f0ff; animation: glitch 1s infinite alternate; }
        @keyframes glitch { 0% { transform: skewX(0deg); } 20% { transform: skewX(-10deg); } 40% { transform: skewX(10deg); } 60% { transform: skewX(0deg); } }
        .hex-clip { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div class="scanline"></div>

    <!-- HUD HEADER -->
    <header id="hud-header" class="hidden border-b border-mars-border bg-mars-bg/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="led-green animate-pulse"></div>
                
                <!-- Trigger Secreto Backdoor (Triple Click) con Logo Oficial -->
                <div onclick="dev.handleTrigger()" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity select-none pr-4 border-r border-mars-border group">
                    <img src="/logo.png" alt="M2" class="w-8 h-8 object-contain drop-shadow-[0_0_8px_rgba(0,240,255,0.8)]">
                    <h1 class="font-orbitron font-black text-mars-cyan text-lg tracking-widest group-hover:text-white transition-colors">MARS-KET 2.0</h1>
                </div>

                <div class="hidden md:flex items-center gap-3">
                    <div id="hud-mini-logo" class="hidden w-6 h-6 hex-clip bg-mars-card border border-mars-cyan flex items-center justify-center overflow-hidden"></div>
                    <span id="hud-cloud-status" class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 border"></span>
                    <span class="text-[9px] text-slate-500 uppercase font-bold">SYS_OP: <span id="hud-mode" class="text-mars-yellow">SECURE_PROTOCOL</span></span>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p class="text-[8px] text-slate-500 uppercase leading-none mb-1 tracking-widest">Saldo Disponible</p>
                    <p id="hud-balance" class="text-mars-green font-bold text-xl font-orbitron tracking-tighter">0.00 €v</p>
                </div>
                <button onclick="auth.logout()" class="border border-mars-magenta/50 text-mars-magenta text-[9px] px-3 py-1 hover:bg-mars-magenta hover:text-white transition-all font-bold tracking-widest">[DESCONEXIÓN]</button>
            </div>
        </div>
        <div class="bg-mars-card/50 border-t border-mars-border px-4 py-1 flex justify-between text-[8px] text-slate-400 font-bold uppercase tracking-widest">
            <div id="hud-info">ENTITY: --- | ROLE: ---</div>
            <div id="hud-clock">TIME: 00:00:00</div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav id="hud-nav" class="hidden bg-mars-card border-b border-mars-border overflow-x-auto scrollbar-hide">
        <div class="max-w-7xl mx-auto flex" id="nav-container"></div>
    </nav>

    <!-- MAIN VIEWPORT -->
    <main id="viewport" class="flex-grow container mx-auto px-4 py-6"></main>

    <!-- MODAL OVERLAY -->
    <div id="modal-overlay" class="fixed inset-0 bg-mars-bg/95 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="terminal-border bg-mars-card w-full max-w-2xl p-6 glow-cyan">
            <h3 id="modal-title" class="font-orbitron text-mars-cyan text-lg mb-4 uppercase tracking-tighter">System Alert</h3>
            <div id="modal-body" class="mb-6 max-h-[70vh] overflow-y-auto pr-2 text-sm text-slate-300"></div>
            <div class="flex justify-end gap-3" id="modal-actions"></div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        // --- 1. CONFIGURACIÓN DE RÚBRICAS (RUBRIC_CONFIG) ---
        const RUBRIC_CONFIG = {
            FYQ: { name: "Física y Química", criteria: [{id: 'c1', name: 'Informe Científico Estequiometría', weight: 0.4}, {id: 'c2', name: 'Lanzamiento, Apogeo y Optimización', weight: 0.4}, {id: 'c3', name: 'Rol Técnico y Q&A', weight: 0.2}] },
            ECO: { name: "Economía", criteria: [{id: 'c1', name: 'Hojas de Cálculo y Trazabilidad', weight: 0.4}, {id: 'c2', name: 'Balances, ROI y Ledger', weight: 0.4}, {id: 'c3', name: 'Desempeño Rol Financiero', weight: 0.2}] },
            LYE: { name: "Liderazgo y Emprend.", criteria: [{id: 'c1', name: 'Project Management y Plazos', weight: 0.4}, {id: 'c2', name: 'Business Plan e I+D', weight: 0.4}, {id: 'c3', name: 'Desempeño Equipo y Conflictos', weight: 0.2}] },
            LEN: { name: "Lengua Castellana", criteria: [{id: 'c1', name: 'Pitch Final y Q&A (Oratoria)', weight: 0.8}, {id: 'c2', name: 'Estructura y Rigor del Dossier', weight: 0.2}] },
            MAT: { name: "Matemáticas", criteria: [{id: 'c1', name: 'Trigonometría y Altitud', weight: 0.7}, {id: 'c2', name: 'Construcción Goniómetro', weight: 0.3}] },
            ING: { name: "Inglés", criteria: [{id: 'c1', name: 'Presentación Prototipo (Micro-Pitch)', weight: 1.0}] }
        };

        // --- 2. CONFIGURACIÓN Y CATÁLOGO INICIAL (5 ROLES) ---
        const INITIAL_DATA = {
            config: { 
                nextOrderId: 1000,
                teachers: {
                    FYQ: { name: "Física y Química", pin: "0101", canSponsor: false },
                    ECO: { name: "Economía", pin: "0202", canSponsor: false },
                    LYE: { name: "Liderazgo y Emprendimiento", pin: "0303", canSponsor: false },
                    LEN: { name: "Lengua Castellana", pin: "0404", canSponsor: false },
                    MAT: { name: "Matemáticas", pin: "0505", canSponsor: false },
                    ING: { name: "Inglés", pin: "0606", canSponsor: false },
                    COORD_MARIO: { name: "Coordinación - Mario", pin: "0001", canSponsor: true },
                    COORD_ALEX: { name: "Coordinación - Alex", pin: "0002", canSponsor: true }
                }
            },
            telemetry: { totalLogins: 0, sessions: [] },
            catalog: [
                { id: 'F01', name: 'Botella PET 500ml', price: 97.0, unit: 'Unidad', category: 'Fuselaje' },
                { id: 'F02', name: 'Botella PET 1L', price: 120.0, unit: 'Unidad', category: 'Fuselaje' },
                { id: 'F03', name: 'Botella PET 1.25L', price: 145.0, unit: 'Unidad', category: 'Fuselaje' },
                { id: 'F04', name: 'Botella PET 1.5L', price: 165.0, unit: 'Unidad', category: 'Fuselaje' },
                { id: 'F05', name: 'Botella PET 2L', price: 200.0, unit: 'Unidad', category: 'Fuselaje' },
                { id: 'P01', name: 'Bicarbonato de Sodio', price: 10.0, unit: 'Gramo', category: 'Propulsión' },
                { id: 'P02', name: 'Vinagre', price: 5.0, unit: '10ml', category: 'Propulsión' },
                { id: 'A01', name: 'Cartón Básico', price: 30.0, unit: 'Set', category: 'Aerodinámica' },
                { id: 'A02', name: 'Aletas de Plástico', price: 50.0, unit: 'Set', category: 'Aerodinámica' },
                { id: 'A03', name: 'Aletas PVC Rígido', price: 85.0, unit: 'Set', category: 'Aerodinámica' },
                { id: 'A04', name: 'Suplemento Plastificado', price: 15.0, unit: 'Unidad', category: 'Aerodinámica' },
                { id: 'A05', name: 'Punta Cartulina', price: 45.0, unit: 'Unidad', category: 'Aerodinámica' },
                { id: 'A06', name: 'Punta PET', price: 95.0, unit: 'Unidad', category: 'Aerodinámica' },
                { id: 'A07', name: 'Punta Impresión 3D', price: 110.0, unit: 'Unidad', category: 'Aerodinámica' },
                { id: 'A08', name: 'Punta Lastrada', price: 135.0, unit: 'Unidad', category: 'Aerodinámica' },
                { id: 'S01', name: 'Papel de Cocina', price: 5.0, unit: 'Unidad', category: 'Sellado' },
                { id: 'S02', name: 'Hilo de Algodón', price: 2.0, unit: 'Decímetro', category: 'Sellado' },
                { id: 'S03', name: 'Corcho de Vino', price: 25.0, unit: 'Unidad', category: 'Sellado' },
                { id: 'S04', name: 'Tapón de Goma Hermético', price: 60.0, unit: 'Unidad', category: 'Sellado' },
                { id: 'S05', name: 'Cinta Aislante', price: 10.0, unit: 'Rollo', category: 'Sellado' },
                { id: 'S06', name: 'Celo Adhesivo', price: 5.0, unit: 'Rollo', category: 'Sellado' },
                { id: 'S07', name: 'Pegamento Termofusible', price: 40.0, unit: 'Barra', category: 'Sellado' },
                { id: 'S08', name: 'Refuerzo de Yeso', price: 18.0, unit: 'Dosis', category: 'Sellado' }
            ],
            companies: {
                astra: { 
                    name: "Astra Dynamics", balance: 1500, logo: null, sponsorAwarded: null, 
                    roles: { CEO:'1111', TECNICO:'1111', FINANZAS:'1111', MARKETING:'1111', OPERACIONES_IA:'1111' }, 
                    valueProposition: "", aiPrompts: [], executiveResolutions: [], cart: [], orders: [], ledger: [], realCosts: [], grades: {}, 
                    loginStats: {totalLogins: 0, roles: {CEO:{count:0}, TECNICO:{count:0}, FINANZAS:{count:0}, MARKETING:{count:0}, OPERACIONES_IA:{count:0}}} 
                },
                orion: { 
                    name: "Orion Labs", balance: 1500, logo: null, sponsorAwarded: null, 
                    roles: { CEO:'2222', TECNICO:'2222', FINANZAS:'2222', MARKETING:'2222', OPERACIONES_IA:'2222' }, 
                    valueProposition: "", aiPrompts: [], executiveResolutions: [], cart: [], orders: [], ledger: [], realCosts: [], grades: {}, 
                    loginStats: {totalLogins: 0, roles: {CEO:{count:0}, TECNICO:{count:0}, FINANZAS:{count:0}, MARKETING:{count:0}, OPERACIONES_IA:{count:0}}} 
                },
                stellar: { 
                    name: "Stellar Solutions", balance: 1500, logo: null, sponsorAwarded: null, 
                    roles: { CEO:'3333', TECNICO:'3333', FINANZAS:'3333', MARKETING:'3333', OPERACIONES_IA:'3333' }, 
                    valueProposition: "", aiPrompts: [], executiveResolutions: [], cart: [], orders: [], ledger: [], realCosts: [], grades: {}, 
                    loginStats: {totalLogins: 0, roles: {CEO:{count:0}, TECNICO:{count:0}, FINANZAS:{count:0}, MARKETING:{count:0}, OPERACIONES_IA:{count:0}}} 
                }
            },
            pendingCustom: []
        };

        // --- 3. MOTOR DE ESTADO (CLOUD HYBRID D1) Y TELEMETRÍA ---
        const state = {
            data: {}, user: null, pin: '', sessionData: null,
            storageKey: 'marsket_v9_BRANDING',
            isCloudOnline: false,
            isSyncing: false,
            syncTimer: null,

            async init() {
                // 1. Local-First: Arranca instantáneo con localStorage
                const saved = localStorage.getItem(this.storageKey);
                this.data = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_DATA));
                
                // MIGRACIÓN ACTIVA A LA NUEVA MATRIZ DE 5 ROLES
                for(let k in this.data.companies) {
                    let co = this.data.companies[k];
                    if(co.logo === undefined) co.logo = null;
                    if(co.sponsorAwarded === undefined) co.sponsorAwarded = null;
                    if(co.valueProposition === undefined) co.valueProposition = "";
                    if(!co.aiPrompts) co.aiPrompts = [];
                    if(!co.executiveResolutions) co.executiveResolutions = [];
                    if(!co.grades) co.grades = {};
                    
                    if(co.roles.QUIMICA || co.roles.AERODINAMICA || co.roles.IA) {
                        const defaultPin = co.roles.CEO || '1234';
                        co.roles = { CEO: co.roles.CEO, TECNICO: co.roles.QUIMICA || defaultPin, FINANZAS: co.roles.FINANZAS || defaultPin, MARKETING: co.roles.MARKETING || defaultPin, OPERACIONES_IA: co.roles.IA || defaultPin };
                    }
                    if(co.loginStats && co.loginStats.roles.QUIMICA) {
                        co.loginStats.roles = {
                            CEO: co.loginStats.roles.CEO || {count:0, lastLogin:null},
                            TECNICO: co.loginStats.roles.QUIMICA || {count:0, lastLogin:null},
                            FINANZAS: co.loginStats.roles.FINANZAS || {count:0, lastLogin:null},
                            MARKETING: co.loginStats.roles.MARKETING || {count:0, lastLogin:null},
                            OPERACIONES_IA: co.loginStats.roles.IA || {count:0, lastLogin:null}
                        };
                    }
                }
                if(this.data.config.teachers.COORD) {
                    delete this.data.config.teachers.COORD;
                    this.data.config.teachers.COORD_MARIO = { name: "Coordinación - Mario", pin: "0001", canSponsor: true };
                    this.data.config.teachers.COORD_ALEX = { name: "Coordinación - Alex", pin: "0002", canSponsor: true };
                }
                
                localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                
                // 2. Renderizado Inmediato UI
                ui.render();
                setInterval(() => {
                    const el = document.getElementById('hud-clock');
                    if(el) el.innerText = `TIME: ${new Date().toLocaleTimeString()}`;
                }, 1000);
                
                // 3. Sincronización Asíncrona Cloud D1
                await this.fetchFromCloud();
            },

            async fetchFromCloud() {
                this.isSyncing = true;
                if(this.user) ui.updateHUD();
                try {
                    const res = await fetch('/api/state');
                    if(res.ok) {
                        const json = await res.json();
                        if(json && json.status !== 'empty') {
                            this.data = json;
                            localStorage.setItem(this.storageKey, JSON.stringify(this.data));
                            this.isCloudOnline = true;
                            ui.render();
                        } else if(json && json.status === 'empty') {
                            this.isCloudOnline = true;
                            await this.pushToCloud(false);
                        }
                    } else {
                        this.isCloudOnline = false;
                    }
                } catch(err) {
                    this.isCloudOnline = false;
                } finally {
                    this.isSyncing = false;
                    if(this.user) ui.updateHUD();
                }
            },

            save() { 
                localStorage.setItem(this.storageKey, JSON.stringify(this.data)); 
                if(this.user) ui.updateHUD(); 
                this.pushToCloud(true);
            },

            async pushToCloud(debounced = false) {
                if(debounced) {
                    clearTimeout(this.syncTimer);
                    this.syncTimer = setTimeout(() => this.pushToCloud(false), 800);
                    return;
                }
                this.isSyncing = true;
                if(this.user) ui.updateHUD();
                try {
                    const res = await fetch('/api/state', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.data)
                    });
                    if(res.ok) {
                        this.isCloudOnline = true;
                    } else {
                        this.isCloudOnline = false;
                    }
                } catch(err) {
                    this.isCloudOnline = false;
                } finally {
                    this.isSyncing = false;
                    if(this.user) ui.updateHUD();
                }
            },

            addToLedger(coId, concept, dept, delta) {
                const co = this.data.companies[coId];
                co.balance += delta;
                co.ledger.unshift({ id: 'TX-' + Math.random().toString(36).substr(2, 5).toUpperCase(), date: new Date().toLocaleString(), concept, dept, delta, final: co.balance });
                this.save();
            }
        };

        const telemetry = {
            startSession(entity, role) {
                state.data.telemetry.totalLogins++;
                state.sessionData = { sessionId: 'SESS-' + Date.now().toString().slice(-6), timestamp: new Date().toISOString(), entity, role, events: [] };
                state.data.telemetry.sessions.unshift(state.sessionData);
                if(state.data.telemetry.sessions.length > 100) state.data.telemetry.sessions.pop();
                state.save();
            },
            log(action, details) {
                if(!state.sessionData) return;
                state.sessionData.events.push({ time: new Date().toLocaleTimeString(), action, details });
                state.save();
            }
        };

        // --- 4. AUTENTICACIÓN Y NORMALIZACIÓN ---
        const auth = {
            press(n) { if(state.pin.length < 4) { state.pin += n; this.updateDots(); } },
            clear() { state.pin = ''; this.updateDots(); },
            updateDots() {
                const dots = document.querySelectorAll('.pin-dot');
                dots.forEach((d, i) => d.style.background = i < state.pin.length ? '#00f0ff' : 'transparent');
            },
            normalizeStr(str) { return str.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_'); },
            
            updateRoleOptions() {
                const coId = document.getElementById('login-co').value;
                const roleSelect = document.getElementById('login-role');
                roleSelect.innerHTML = '';
                
                if (coId === 'admin') {
                    Object.keys(state.data.config.teachers).forEach(key => {
                        const opt = document.createElement('option');
                        opt.value = key; opt.innerText = state.data.config.teachers[key].name;
                        roleSelect.appendChild(opt);
                    });
                } else {
                    const roles = ['CEO', 'Técnico', 'Finanzas', 'Marketing', 'Operaciones IA'];
                    roles.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r; opt.innerText = r;
                        roleSelect.appendChild(opt);
                    });
                }
            },

            verify() {
                const coId = document.getElementById('login-co').value;
                const roleRaw = document.getElementById('login-role').value;
                const roleNorm = this.normalizeStr(roleRaw);
                
                if(coId === 'admin' && state.pin === '9999') { dev.open(); this.clear(); return; }

                if (coId === 'admin') {
                    const teacher = state.data.config.teachers[roleRaw];
                    if(teacher && state.pin === teacher.pin) {
                        this.login('admin', roleRaw, true, teacher.name);
                    } else this.fail();
                } else {
                    const co = state.data.companies[coId];
                    if(co && co.roles[roleNorm] === state.pin) {
                        this.login(coId, roleNorm, false, co.name);
                    } else this.fail();
                }
            },
            fail() { alert("AUTH DENIED: PIN INCORRECTO"); this.clear(); },
            login(coId, roleKey, admin, entityName) {
                state.user = { coId, role: roleKey, admin };
                state.pin = '';
                
                if(!admin) {
                    const co = state.data.companies[coId];
                    co.loginStats.totalLogins++;
                    if(!co.loginStats.roles[roleKey]) co.loginStats.roles[roleKey] = {count:0, lastLogin:null};
                    co.loginStats.roles[roleKey].count++;
                    co.loginStats.roles[roleKey].lastLogin = new Date().toLocaleString();
                }
                
                telemetry.startSession(entityName, roleKey);
                
                document.getElementById('hud-header').classList.remove('hidden');
                document.getElementById('hud-nav').classList.remove('hidden');
                this.buildNav(admin);
                
                // Redirección por defecto según rol
                if (admin) ui.navigate('admin');
                else if (roleKey === 'CEO') ui.navigate('orders');
                else if (roleKey === 'TECNICO') ui.navigate('market');
                else if (roleKey === 'FINANZAS') ui.navigate('finance');
                else if (roleKey === 'MARKETING') ui.navigate('brand');
                else if (roleKey === 'OPERACIONES_IA') ui.navigate('ailog');
                else ui.navigate('dossier');
            },
            logout() { location.reload(); },
            
            buildNav(isAdmin) {
                const nav = document.getElementById('nav-container');
                if (isAdmin) {
                    nav.innerHTML = `
                        <button onclick="ui.navigate('admin')" class="nav-tab tab-active px-6 py-4 text-[10px] font-bold uppercase border-r border-mars-border text-mars-yellow">Terminal Docente</button>
                        <button onclick="ui.navigate('market')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Catálogo Oficial</button>
                        <button onclick="ui.navigate('dossier')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Dossier y Rúbricas</button>
                    `;
                    return;
                }
                
                const role = state.user.role;
                let html = '';
                
                if (role === 'CEO') {
                    html += `<button onclick="ui.navigate('orders')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Órdenes CEO (Bóveda)</button>`;
                    html += `<button onclick="ui.navigate('finance')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Finanzas</button>`;
                    html += `<button onclick="ui.navigate('resolutions')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Actas Desempate</button>`;
                } else if (role === 'TECNICO') {
                    html += `<button onclick="ui.navigate('market')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Catálogo Oficial</button>`;
                    html += `<button onclick="ui.modalCustom()" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase text-mars-magenta hover:bg-mars-magenta/10">Material No Catalogado (I+D)</button>`;
                } else if (role === 'FINANZAS') {
                    html += `<button onclick="ui.navigate('finance')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Finanzas / Ledger</button>`;
                    html += `<button onclick="ui.navigate('orders')" class="nav-tab px-6 py-4 text-[10px] font-bold uppercase hover:text-mars-cyan">Órdenes de Compra</button>`;
                } else if (role === 'MARKETING') {

                const imgHtml = co.logo ? `<img src="${co.logo}" class="w-12 h-12 object-cover hex-clip border border-mars-cyan">` : `<div class="w-12 h-12 hex-clip border border-mars-cyan flex items-center justify-center bg-slate-900 text-[10px]">🚀</div>`;
                
                let html = `
                <div class="flex items-center gap-4 border-b border-mars-border pb-4 mb-4">
                    ${imgHtml}
                    <div>
                        <h4 class="font-orbitron text-white text-sm uppercase">${co.name}</h4>
                        <p class="text-[10px] text-mars-cyan font-bold uppercase tracking-widest">Logins Acumulados: ${stats.totalLogins}</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">`;
                
                ['CEO', 'TECNICO', 'FINANZAS', 'MARKETING', 'OPERACIONES_IA'].forEach(r => {
                    const pin = co.roles[r];
                    const count = stats.roles[r]?.count || 0;
                    const last = stats.roles[r]?.lastLogin || 'NUNCA';
                    
                    let colorClass = count > 4 ? 'text-mars-green' : (count > 0 ? 'text-mars-yellow' : 'text-mars-magenta animate-pulse');
                    let statusTxt = count > 4 ? 'NOMINAL' : (count > 0 ? 'WARNING' : 'CRITICAL - OFFLINE');
                    
                    html += `
                    <div class="bg-black border border-mars-border p-3 flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[8px] text-slate-400 font-bold uppercase tracking-tighter truncate pr-1">${r.replace('_',' ')}</span>
                            <span class="text-[8px] text-white bg-slate-800 px-1 border border-slate-600">PIN: ${pin}</span>
                        </div>
                        <div class="text-center my-2">
                            <span class="text-2xl font-orbitron ${colorClass}">${count}</span>
                            <p class="text-[7px] text-slate-500 uppercase">Accesos</p>
                        </div>
                        <div class="border-t border-slate-800 pt-2 text-[7px] uppercase font-bold text-center">
                            <p class="text-slate-400 mb-1">Última: ${last}</p>
                            <p class="${colorClass}">${statusTxt}</p>
                        </div>
                    </div>`;
                });
                html += `</div>`;
                this.showModal("Auditoría de Miembros", html, "");
            },

            // --- LÓGICA DE NEGOCIO ---
            saveValueProposition() {
                const text = document.getElementById('val-prop-text').value;
                state.data.companies[state.user.coId].valueProposition = text;
                telemetry.log("BRANDING", "Propuesta de Valor guardada.");
                state.save();
                alert("Propuesta de valor actualizada en el servidor.");
            },
            
            saveResolution() {
                const text = document.getElementById('ceo-res-text').value;
                if(text.length < 10) return alert("El acta es demasiado corta.");
                state.data.companies[state.user.coId].executiveResolutions.unshift({ text: text, date: new Date().toLocaleString() });
                telemetry.log("RESOLUCIÓN CEO", "Acta emitida.");
                state.save();
                this.render();
                alert("Acta de resolución oficial publicada con éxito.");
            },

            modalReportAI() {
                const html = `
                    <div class="space-y-4">
                        <div>
                            <label class="text-[9px] text-blue-400 uppercase font-bold block mb-1">Herramienta Utilizada</label>
                            <input id="ai-tool" placeholder="Ej: ChatGPT, Gemini, Claude..." class="w-full bg-slate-900 border border-blue-500/50 p-2 text-xs text-white uppercase focus:border-blue-400 outline-none">
                        </div>
                        <div>
                            <label class="text-[9px] text-blue-400 uppercase font-bold block mb-1">Tarea Ejecutada</label>
                            <input id="ai-task" placeholder="Ej: Cálculos de masa, diseño de logotipo, redacción..." class="w-full bg-slate-900 border border-blue-500/50 p-2 text-xs text-white uppercase focus:border-blue-400 outline-none">
                        </div>
                        <div>
                            <label class="text-[9px] text-blue-400 uppercase font-bold block mb-1">Prompt Exacto Introducido</label>
                            <textarea id="ai-prompt" placeholder="Escriba el prompt exacto que usó en la IA..." class="w-full bg-slate-900 border border-blue-500/50 p-3 text-xs text-white h-24 focus:border-blue-400 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="text-[9px] text-mars-green uppercase font-bold block mb-1">Auditoría / Verificación Humana</label>
                            <textarea id="ai-verification" placeholder="¿Cómo ha comprobado que la respuesta de la IA era correcta y no inventada?" class="w-full bg-slate-900 border border-mars-green/50 p-3 text-xs text-white h-20 focus:border-mars-green outline-none"></textarea>
                        </div>
                    </div>`;
                const actions = `<button onclick="ui.submitAIPrompt()" class="bg-blue-600 text-white px-6 py-2 text-[10px] font-black uppercase tracking-widest hover:bg-blue-500 transition-all shadow-[0_0_10px_rgba(59,130,246,0.3)]">Registrar Uso en Bitácora</button>`;
                this.showModal("Reportar Uso de IA", html, actions);
            },
            
            submitAIPrompt() {
                const tool = document.getElementById('ai-tool').value;
                const task = document.getElementById('ai-task').value;
                const promptText = document.getElementById('ai-prompt').value;
                const verification = document.getElementById('ai-verification').value;
                
                if(!tool || !task || !promptText || !verification) return alert("Por favor, rellene todos los campos para la auditoría.");
                
                const status = (state.user.role === 'OPERACIONES_IA') ? 'APROBADO' : 'PENDIENTE_VALIDACION';
                
                state.data.companies[state.user.coId].aiPrompts.unshift({
                    id: 'AI-' + Date.now(),
                    authorRole: state.user.role,
                    tool, task, prompt: promptText, verification, status,
                    date: new Date().toLocaleString()
                });
                
                telemetry.log("USO IA", `Reporte enviado (${status}). Tarea: ${task}`);
                state.save();
                this.closeModal();
                alert(status === 'APROBADO' ? "Registro añadido a la bitácora oficial." : "Reporte enviado. Pendiente de auditoría por el Director de Operaciones/IA.");
                this.render();
            },
            
            processAIPrompt(id, newStatus) {
                const p = state.data.companies[state.user.coId].aiPrompts.find(x => x.id === id);
                if(p) {
                    p.status = newStatus;
                    telemetry.log("AUDITORÍA IA", `Prompt ${id} -> ${newStatus}`);
                    state.save();
                    this.render();
                }
            },

            // --- RESTO DE LÓGICA EXISTENTE ---
            selectEvalCo(cid) { this.evalSelectedCo = cid; this.render(); },
            calcRealtimeGrade(subject) {
                const config = RUBRIC_CONFIG[subject];
                let total = 0;
                config.criteria.forEach(c => {
                    const val = parseFloat(document.getElementById(`grade-${c.id}`).value) || 0;
                    total += val * c.weight;
                });
                document.getElementById('realtime-grade').innerText = total.toFixed(2);
            },
            saveGrade(subject) {
                if(!this.evalSelectedCo) return alert("Seleccione una empresa primero.");
                const config = RUBRIC_CONFIG[subject];
                let scores = {}; let final = 0;
                config.criteria.forEach(c => {
                    const val = parseFloat(document.getElementById(`grade-${c.id}`).value) || 0;
                    scores[c.id] = val; final += val * c.weight;
                });
                const feedback = document.getElementById('eval-feedback').value;
                state.data.companies[this.evalSelectedCo].grades[subject] = { scores, final, feedback, updatedAt: new Date().toLocaleString() };
                telemetry.log("EVALUACIÓN", `Materia: ${subject} | Empresa: ${state.data.companies[this.evalSelectedCo].name} | Nota: ${final.toFixed(2)}`);
                state.save(); alert(`Calificación de ${final.toFixed(2)} guardada correctamente.`); this.render();
            },

            addToCart(id, qty = 1) {
                const item = state.data.catalog.find(i => i.id === id);
                if (id === 'P01' || id === 'P02') state.data.companies[state.user.coId].cart.push({...item, qty, price: item.price * qty, name: `${item.name} (${qty}${item.unit})`});
                else state.data.companies[state.user.coId].cart.push({...item, qty, price: item.price * qty});
                telemetry.log("CARRITO", `Añadido: ${item.name} x${qty}`);
                state.save(); this.render();
            },
            removeFromCart(idx) { state.data.companies[state.user.coId].cart.splice(idx, 1); state.save(); this.render(); },
            submitOrder() {
                const co = state.data.companies[state.user.coId];
                const audit = document.getElementById('audit-text').value;
                const realEur = parseFloat(document.getElementById('real-cost-input').value);
                const realShop = document.getElementById('real-shop-input').value;

                if(audit.length < 15) return alert("Justificación técnica insuficiente.");
                if(isNaN(realEur) || realEur < 0) return alert("Coste real en Euros inválido (0 si reciclado).");
                if(!realShop) return alert("Indique procedencia.");

                const total = co.cart.reduce((s, i) => s + i.price, 0);
                co.orders.unshift({ id: state.data.config.nextOrderId++, items: [...co.cart], total, justification: audit, realEur, realShop, status: 'PENDIENTE_CEO', date: new Date().toLocaleString() });
                telemetry.log("ORDEN", `Importe: ${total.toFixed(2)}€v | Real: ${realEur}€`);
                co.cart = []; state.save(); this.navigate('orders');
            },
            promptDenyOrder(oid) {
                const html = `<input type="text" id="deny-reason" class="w-full bg-black border border-mars-magenta p-3 text-xs text-white" placeholder="Motivo del rechazo...">`;
                const btn = `<button onclick="ui.finalizeDenyOrder(${oid})" class="bg-mars-magenta text-white px-6 py-2 text-[10px] font-bold uppercase hover:bg-white hover:text-mars-magenta">Confirmar Denegación</button>`;
                this.showModal("Denegar Orden", html, btn);
            },
            finalizeDenyOrder(oid) {
                const reason = document.getElementById('deny-reason').value;
                if(!reason) return alert("Especifique motivo.");
                const o = state.data.companies[state.user.coId].orders.find(ord => ord.id === oid);
                o.status = 'DENEGADO'; o.denyReason = reason;
                telemetry.log("DENEGADO", `Orden #${oid} - Motivo: ${reason}`);
                state.save(); this.closeModal(); this.render();
            },
            processOrder(oid, status) {
                const co = state.data.companies[state.user.coId];
                const o = co.orders.find(ord => ord.id === oid);
                if(status === 'APROBADO') {
                    if(co.balance < o.total) return alert("Fondos insuficientes.");
                    state.addToLedger(state.user.coId, `Adquisición (Order #${oid})`, 'FINANZAS', -o.total);
                    co.realCosts.unshift({ shop: o.realShop, item: `Order #${oid} Materiales`, eur: o.realEur });
                    o.status = 'APROBADO';
                    telemetry.log("APROBADO", `Orden #${oid} pagada.`);
                }
                state.save(); this.render();
            },
            modalCustom() {
                this.showModal('Solicitud Extra-Catálogo', `<input id="custom-name" placeholder="Artículo" class="w-full bg-slate-900 border border-mars-border p-3 text-xs mb-4 text-white font-bold uppercase"><textarea id="custom-reason" placeholder="Justificación..." class="w-full bg-slate-900 border border-mars-border p-3 text-xs text-white h-24"></textarea>`, `<button onclick="ui.submitCustom()" class="bg-mars-magenta text-white px-6 py-2 text-xs font-black uppercase">Enviar Solicitud</button>`);
            },
            submitCustom() {
                const name = document.getElementById('custom-name').value;
                const reason = document.getElementById('custom-reason').value;
                if(!name || !reason) return;
                state.data.pendingCustom.push({ id: Date.now(), company: state.user.coId, name, reason });
                telemetry.log("EXTERNO", `Petición: ${name}`);
                state.save(); this.closeModal();
            },
            
            // DOCENTE ACTIONS
            createStartup() {
                const name = document.getElementById('new-co-name').value;
                const cap = parseFloat(document.getElementById('new-co-cap').value);
                if(!name || isNaN(cap)) return alert("Datos inválidos.");
                const cid = 'co_' + Date.now();
                state.data.companies[cid] = { 
                    name, balance: cap, logo: null, sponsorAwarded: null, valueProposition: "",
                    roles: { CEO:'1234', TECNICO:'1234', FINANZAS:'1234', MARKETING:'1234', OPERACIONES_IA:'1234' }, 
                    aiPrompts: [], executiveResolutions: [], cart: [], orders: [], ledger: [], realCosts: [], grades: {}, 
                    loginStats: { totalLogins: 0, roles: { CEO:{count:0}, TECNICO:{count:0}, FINANZAS:{count:0}, MARKETING:{count:0}, OPERACIONES_IA:{count:0} } } 
                };
                state.save(); this.render();
            },
            deleteStartup(cid) { delete state.data.companies[cid]; state.save(); this.render(); },
            updatePIN(coId, role, val) { if(val.length !== 4) return alert("4 dígitos."); state.data.companies[coId].roles[role] = val; state.save(); },
            changeTeacherPIN() {
                const np = document.getElementById('new-teacher-pin').value;
                if(np.length !== 4) return alert("4 dígitos.");
                state.data.config.teachers[state.user.role].pin = np; state.save();
                alert("PIN Actualizado."); document.getElementById('new-teacher-pin').value = '';
            },
            teacherValidate(pid, ok) {
                const reqIdx = state.data.pendingCustom.findIndex(p => p.id == pid);
                if(ok) {
                    const price = parseFloat(document.getElementById(`val-price-${pid}`).value);
                    if(!price) return alert("Falta precio €v.");
                    state.data.catalog.unshift({ id: 'CUST-'+pid, name: `[ESP] ${state.data.pendingCustom[reqIdx].name}`, price, unit: 'Especial', category: 'Externo' });
                }
                state.data.pendingCustom.splice(reqIdx, 1); state.save(); this.render();
            },
            teacherCapital(cid, amount, desc, tier) { 
                state.addToLedger(cid, desc, 'DOCENTE', amount); 
                if(tier) state.data.companies[cid].sponsorAwarded = tier;
                this.render(); 
            },
            teacherFine(cid, amount, desc) { state.addToLedger(cid, desc, 'DOCENTE', amount); this.render(); },
            
            // EXPORT & BACKUP
            exportCSV() {
                let csv = "Empresa,Fecha,Concepto,Departamento,Variacion_Virtual,Saldo_Final_Virtual\n";
                for (const coId in state.data.companies) state.data.companies[coId].ledger.forEach(l => { csv += `"${state.data.companies[coId].name}","${l.date}","${l.concept}","${l.dept}",${l.delta},${l.final}\n`; });
                this.downloadFile(csv, 'csv', 'marsket_ledger_export.csv');
            },
            exportActaCSV() {
                let csv = "Empresa,FYQ,ECO,LYE,LEN,MAT,ING,Media_Global\n";
                Object.values(state.data.companies).forEach(co => {
                    const g = co.grades || {};
                    const vals = ['FYQ','ECO','LYE','LEN','MAT','ING'].map(s => g[s] ? g[s].final.toFixed(2) : '');
                    const numVals = vals.filter(v => v !== '').map(Number);
                    const avg = numVals.length > 0 ? (numVals.reduce((a,b)=>a+b,0)/numVals.length).toFixed(2) : '';
                    csv += `"${co.name}",${vals.join(',')},${avg}\n`;
                });
                this.downloadFile(csv, 'csv', 'marsket_acta_notas.csv');
            },
            exportJSON() { this.downloadFile(JSON.stringify(state.data, null, 2), 'json', `marsket_backup_${new Date().getTime()}.json`); },
            downloadFile(content, ext, filename) {
                const blob = new Blob([content], { type: ext === 'csv' ? 'text/csv;charset=utf-8;' : 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
            },
            importJSON(e) {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => { try { state.data = JSON.parse(ev.target.result); state.save(); location.reload(); } catch(err) { alert("JSON inválido."); } };
                reader.readAsText(file);
            },
            showModal(title, body, actions) {
                document.getElementById('modal-title').innerText = title; document.getElementById('modal-body').innerHTML = body; document.getElementById('modal-actions').innerHTML = actions + `<button onclick="ui.closeModal()" class="bg-slate-800 text-white px-4 py-2 text-[10px] font-bold uppercase hover:bg-slate-700 transition-all shadow-md hover:shadow-white/20 border border-slate-600">Cerrar</button>`; document.getElementById('modal-overlay').classList.remove('hidden');
            },
            closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
        };

        window.onload = function() { state.init(); };
    </script>
</body>
</html>
